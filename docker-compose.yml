services:
  brave-search-mcp:
    build: .
    container_name: brave-search-mcp-server
    ports:
      - "8080:8080"
    environment:
      - BRAVE_API_KEYS_FILE=/app/keys.txt
      - BRAVE_MCP_HOST=0.0.0.0
      - BRAVE_MCP_PORT=8080
    volumes:
      - ./keys.txt:/app/keys.txt
    restart: unless-stopped
